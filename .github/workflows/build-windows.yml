name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - 'speech-to-text/main.py'
      - 'speech-to-text/requirements.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: speech-to-text
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MeetingRecorder main.py
      - name: Package desktop app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/MeetingRecorder.exe release/
          Copy-Item run.bat release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath MeetingRecorder-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingRecorder-Windows
          path: speech-to-text/MeetingRecorder-Windows.zip
