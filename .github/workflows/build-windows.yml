name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - 'speech-to-text/main.py'
      - 'speech-to-text/requirements.txt'
      - 'speech-to-text/installer.iss'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: speech-to-text
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-data faster_whisper --name MeetingRecorder main.py
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingRecorder-Setup
          path: speech-to-text/installer/MeetingRecorder-Setup.exe
